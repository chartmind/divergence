name: Daily calibration
on:
  schedule:
    - cron: '35 20 * * 1-5'
    - cron: '0 11 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run calibration
        run: node calibrate.mjs
      - name: Publish data
        run: |
          git config user.name "divergence-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily calibration $(date -u +%F)"
          git push
